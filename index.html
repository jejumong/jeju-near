<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>가까이 제주</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --sea:#0e6a74; --sea-soft:#e7f2f2; --tang:#ee7d22; --tang-soft:#fdf1e6;
  --bg:#f5f6f4; --card:#fff; --ink:#18232a; --sub:#6b7680; --mute:#9aa3ab;
  --line:#e8eaec; --bus:#2563eb; --radius:16px;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;letter-spacing:-.2px}
button{font-family:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 헤더 */
header{background:#fff;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:10px;padding:14px 0 10px}
.logo{width:34px;height:34px;border-radius:11px;background:var(--sea);color:#fff;display:flex;align-items:center;justify-content:center}
.logo svg{width:19px;height:19px}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:17px;font-weight:800}
.brand span{font-size:12px;color:var(--sub)}
.locbtn{display:flex;align-items:center;gap:5px;max-width:55%;background:var(--sea-soft);color:var(--sea);border:0;border-radius:999px;padding:7px 11px 7px 9px;font-size:13px;font-weight:600;cursor:pointer}
.locbtn svg{width:16px;height:16px}
.locbtn em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.locbtn.busy svg.r{animation:spin 1s linear infinite}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-bottom:10px}
nav button{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;border-radius:12px;padding:8px 2px;color:var(--mute);font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s}
nav button svg{width:22px;height:22px}
nav button.on{background:var(--sea-soft);color:var(--sea)}

/* 검색 */
main{padding-top:16px;padding-bottom:48px}
.search{position:relative}
.search svg.s{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--mute)}
.search input{width:100%;font-size:16px;font-family:inherit;padding:15px 64px 15px 46px;border:1.5px solid var(--line);border-radius:14px;background:#fff;outline:none;color:var(--ink);transition:.15s}
.search input:focus{border-color:var(--sea);box-shadow:0 0 0 4px var(--sea-soft)}
.search input::-webkit-search-cancel-button{display:none}
.go{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;border-radius:11px;background:var(--tang);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.chips{display:flex;gap:7px;overflow-x:auto;margin:12px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:13.5px;color:var(--ink);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--sea);color:var(--sea)}
.chip.on{background:var(--sea);border-color:var(--sea);color:#fff}
.seg{display:inline-flex;gap:2px;margin-top:12px;background:#eceeec;border-radius:11px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:9px;font-size:13px;color:var(--sub);cursor:pointer;font-weight:600}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.radius{display:flex;align-items:center;gap:10px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.radius::-webkit-scrollbar{display:none}
.radius>span{flex:none;font-size:13px;font-weight:600;color:var(--sub)}
.radius .seg{margin-top:0;flex:none}
.radius .seg button{padding:6px 10px}
.radius .seg button.on{background:var(--sea);color:#fff}

/* 지도·결과 */
#map{height:240px;border-radius:var(--radius);margin:16px 0 0;overflow:hidden;display:none;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.notice{background:var(--tang-soft);color:#8a4b12;border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.55;margin-top:14px}
.empty,.loading{text-align:center;color:var(--sub);padding:44px 10px;font-size:14px;line-height:1.65}
.empty .ill{width:56px;height:56px;margin:0 auto 12px;border-radius:18px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--sea)}
.empty .ill svg{width:26px;height:26px}
.loading:before{content:"";display:block;width:26px;height:26px;margin:0 auto 12px;border:3px solid var(--sea-soft);border-top-color:var(--sea);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rhead{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--sub);margin:20px 2px 2px}
.rhead b{color:var(--ink);font-size:15px}
.card{background:var(--card);border-radius:var(--radius);padding:15px 16px;margin-top:10px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 0 0 1px rgba(16,24,40,.04)}
.prow{display:flex;gap:12px;cursor:pointer}
.num{flex:none;width:26px;height:26px;border-radius:9px;background:var(--sea-soft);color:var(--sea);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.pmain{flex:1;min-width:0}
.pname{font-size:16px;font-weight:700;line-height:1.35}
.pick{display:inline-block;background:var(--tang);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;margin-right:6px;vertical-align:2px}
.pmeta{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);margin-top:4px}
.dist{color:var(--sea);font-weight:700}
.dot{width:3px;height:3px;border-radius:50%;background:var(--mute)}
.paddr{font-size:13px;color:var(--mute);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtns{display:flex;gap:6px;margin-top:12px;padding-left:38px}
.pbtns a{display:flex;align-items:center;gap:5px;text-decoration:none;font-size:13px;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-weight:600}
.pbtns a svg{width:15px;height:15px;color:var(--sea)}
.pbtns a.main{background:var(--sea);border-color:var(--sea);color:#fff}
.pbtns a.main svg{color:#fff}

/* 대중교통 */
.cands{margin-top:16px;font-size:13px;color:var(--sub)}
.cands .row{display:flex;gap:7px;overflow-x:auto;margin:8px -16px 0;padding:0 16px;scrollbar-width:none}
.clist{padding:6px}
.crow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:10px;cursor:pointer;color:var(--ink)}
.crow+.crow{margin-top:2px}
.crow .radio{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid #cfd5da}
.crow.on{background:var(--sea-soft)}
.crow.on .radio{border:5px solid var(--sea)}
.cmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cmain b{font-size:15px}
.cmain span{font-size:12.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cdist{flex:none;font-size:12.5px;color:var(--sea);font-weight:700}
.more{display:block;width:100%;margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:14px;font-weight:700;color:var(--sea);cursor:pointer}
.more span{color:var(--mute);font-weight:500}
.klink{font-size:13px;color:var(--sea);font-weight:600;text-decoration:none}
.dest .dlabel{font-size:12px;color:var(--tang);font-weight:700;margin-bottom:2px}
.dest .paddr{white-space:normal}
.route .rtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.route .time{font-size:24px;font-weight:800;color:var(--ink)}
.route .time small{font-size:15px;font-weight:700}
.route .best{background:var(--sea);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:3px 7px}
.route .rinfo{width:100%;font-size:13px;color:var(--sub);margin-top:2px}
.route .sum{margin-top:12px;font-size:14px;line-height:1.55;background:var(--sea-soft);color:#11484f;border-radius:12px;padding:10px 12px}
.steps{list-style:none;margin:14px 0 0;padding:0}
.steps li{position:relative;padding:0 0 14px 24px;font-size:14px;line-height:1.55}
.steps li:before{content:"";position:absolute;left:5px;top:6px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid #c8cfd4}
.steps li:after{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:#e3e7ea}
.steps li:last-child{padding-bottom:0}
.steps li:last-child:after{display:none}
.steps li.ride:before{border-color:var(--bus);background:var(--bus)}
.steps li.end:before{border-color:var(--tang);background:var(--tang)}
.steps .s{color:var(--sub);font-size:12.5px}
.bus{display:inline-block;background:var(--bus);color:#fff;font-weight:800;border-radius:7px;padding:2px 9px;margin:0 4px 5px 0;font-size:14px}

/* 지도 마커 */
.mk{background:var(--sea);color:#fff;font:700 12px Pretendard,sans-serif;border-radius:10px;padding:4px 8px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);white-space:nowrap}
.mk.dest{background:var(--tang)}
.mk.stop{background:var(--bus)}
.me{width:16px;height:16px;border-radius:50%;background:#2f7cf6;border:3px solid #fff;box-shadow:0 0 0 7px rgba(47,124,246,.2)}
footer{text-align:center;font-size:11.5px;color:var(--mute);margin-top:32px}
</style>
</head>

<script>
const CONFIG = {
  KAKAO_JS_KEY: 'e8daa949540834b55af58b73b1a279ef',
  ODSAY_API_KEY: 'pshQOPjTqtKhMAvl7+eZ/Q'
};
/* 내가 '맛집'으로 등록한 가게 이름 — 검색 결과에서 '추천'으로 맨 위에 보여요 */
const MY_PICKS = [
  // '자매국수', '올래국수',
];
const DEFAULT_POS = { lat: 33.4996, lng: 126.5312 }; // 위치를 못 받으면 제주시청 기준

const TABS = {
  transit: { ph: '어디로 갈까요? 예) 제주공항', icon:'bus', hint:'목적지를 검색하면<br>타야 할 정류장과 버스 번호를 알려드려요.', chips: [
    {label:'가까운 정류장', special:'stops'},{label:'제주국제공항'},{label:'제주버스터미널'},{label:'동문시장'},{label:'성산일출봉'},{label:'중문관광단지'} ]},
  food: { ph: '무엇을 먹을까요? 예) 고기국수', icon:'food', hint:'먹고 싶은 메뉴를 검색하면<br>가까운 순으로 보여드려요.', chips: [
    {label:'고기국수'},{label:'흑돼지'},{label:'해장국'},{label:'회'},{label:'카페'},{label:'빵집'} ]},
  spot: { ph: '명소 검색 예) 오름, 해수욕장', icon:'camera', hint:'주변 명소를 둘러보세요.', chips: [
    {label:'주변 명소', cat:'AT4'},{label:'오름'},{label:'해수욕장'},{label:'박물관'},{label:'올레길'} ]},
  life: { ph: '편의시설 검색 예) 다이소', icon:'store', hint:'필요한 곳을 눌러 보세요.', chips: [
    {label:'편의점',cat:'CS2'},{label:'약국',cat:'PM9'},{label:'병원',cat:'HP8'},{label:'마트',cat:'MT1'},{label:'주유소',cat:'OL7'},{label:'주차장',cat:'PK6'},{label:'은행',cat:'BK9'} ]}
};

const S = { tab:'food', me:null, kakao:false, ps:null, map:null, overlays:[], foodFilter:'all', cands:[], list:null, authFail:false, radius:10000, last:null };
const RADII = [1, 5, 10, 30, 50, 70]; // km
try { const r = +localStorage.getItem('radius'); if (RADII.includes(r / 1000)) S.radius = r; } catch(e) {}
const $ = s => document.querySelector(s);
const ic = n => `<svg class="i"><use href="#i-${n}"/></svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDist = m => { m = Number(m)||0; return m < 1000 ? `${m}m` : `${+(m/1000).toFixed(1)}km`; };
const isPick = name => MY_PICKS.some(n => name.replace(/\s/g,'').includes(n.replace(/\s/g,'')));
const loading = msg => $('#results').innerHTML = `<div class="loading">${esc(msg)}</div>`;
const empty = (msg, icon) => $('#results').innerHTML = `<div class="empty"><div class="ill">${ic(icon || TABS[S.tab].icon)}</div>${msg}</div>`;
const failMsg = '지금은 장소 정보를 불러오지 못했어요.<br>잠시 후 다시 시도해 주세요.';

/* ---------- 카카오 ---------- */
function loadKakao(){
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(CONFIG.KAKAO_JS_KEY)}&libraries=services&autoload=false`;
    s.onload = () => { try { kakao.maps.load(res); } catch(e) { rej(e); } };
    s.onerror = rej;
    document.head.appendChild(s);
  });
}
function handleStatus(d, st){
  if (st === kakao.maps.services.Status.OK) return d;
  if (st === kakao.maps.services.Status.ERROR) S.authFail = true;
  return [];
}
/* 카카오 검색은 한 번에 최대 45곳(15곳 × 3쪽)만 줘요.
   그래서 범위를 네모 구역으로 덮고, 한 구역에 45곳이 넘으면 4등분해서 다시 찾는 식으로 모두 모아요. */
const MAX_REQ = 120; // 검색 한 번에 쓰는 카카오 요청 상한
function collect(fn, arg, extra, R){
  const { lat, lng } = S.me, cos = Math.cos(lat * Math.PI / 180);
  const dLat = R / 111320, dLng = R / (111320 * cos);
  const found = new Map(); let req = 0;
  const call = (b, page) => new Promise(res => {
    req++;
    const opts = Object.assign({
      location: new kakao.maps.LatLng(lat, lng), sort: kakao.maps.services.SortBy.DISTANCE, page,
      bounds: new kakao.maps.LatLngBounds(new kakao.maps.LatLng(b.s, b.w), new kakao.maps.LatLng(b.n, b.e))
    }, extra || {});
    S.ps[fn](arg, (d, st, pg) => res({ d: handleStatus(d, st), total: pg ? pg.totalCount : 0 }), opts);
  });
  const add = list => list.forEach(p => { if (+p.distance <= R) found.set(p.id, p); });
  const farFromMe = b => { // 구역에서 내 위치와 가장 가까운 점까지의 거리
    const y = Math.min(Math.max(lat, b.s), b.n), x = Math.min(Math.max(lng, b.w), b.e);
    return Math.hypot((y - lat) * 111320, (x - lng) * 111320 * cos) > R;
  };
  async function area(b, depth){
    if (farFromMe(b) || req >= MAX_REQ || S.authFail) return;
    const first = await call(b, 1);
    const km = (b.n - b.s) * 111.32;
    if (first.total > 45 && depth < 7 && km > 1 && req + 4 <= MAX_REQ) {
      const mLat = (b.n + b.s) / 2, mLng = (b.e + b.w) / 2;
      await Promise.all([
        { s: b.s, n: mLat, w: b.w, e: mLng }, { s: b.s, n: mLat, w: mLng, e: b.e },
        { s: mLat, n: b.n, w: b.w, e: mLng }, { s: mLat, n: b.n, w: mLng, e: b.e }
      ].map(c => area(c, depth + 1)));
      return;
    }
    if (first.total > 45) S.partial = true;
    add(first.d);
    const pages = Math.min(3, Math.ceil(Math.min(first.total, 45) / 15));
    const rest = await Promise.all([2, 3].slice(0, Math.max(0, pages - 1)).map(p => call(b, p)));
    rest.forEach(r => add(r.d));
  }
  return area({ s: lat - dLat, n: lat + dLat, w: lng - dLng, e: lng + dLng }, 0).then(() => [...found.values()]);
}
const kwR  = (q, extra, R = S.radius) => collect('keywordSearch', q, extra, R);
const catR = (code, label, R = S.radius) => collect('categorySearch', code, null, R);

/* ---------- 위치 ---------- */
function locate(){
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lng: p.coords.longitude }),
      () => res(null),
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
  });
}
async function refreshLocation(){
  const b = $('#btnLoc'); b.classList.add('busy');
  $('#locLabel').textContent = '위치 찾는 중…';
  const pos = await locate();
  b.classList.remove('busy');
  S.me = pos || { ...DEFAULT_POS };
  if (!pos) { $('#locLabel').textContent = '제주시청 기준'; return; }
  $('#locLabel').textContent = '현재 위치';
  if (S.kakao) {
    new kakao.maps.services.Geocoder().coord2RegionCode(S.me.lng, S.me.lat, (r, st) => {
      if (st !== kakao.maps.services.Status.OK) return;
      const h = r.find(x => x.region_type === 'H') || r[0];
      $('#locLabel').textContent = `${h.region_2depth_name} ${h.region_3depth_name}`;
    });
  }
}

/* ---------- 지도 ---------- */
function drawPoints(points){
  if (!S.kakao || !points.length) return;
  const el = $('#map'); el.style.display = 'block';
  if (!S.map) S.map = new kakao.maps.Map(el, { center: new kakao.maps.LatLng(S.me.lat, S.me.lng), level: 5 });
  else S.map.relayout();
  S.overlays.forEach(o => o.setMap(null)); S.overlays = [];
  const bounds = new kakao.maps.LatLngBounds();
  const add = (lat, lng, html, y) => {
    const pos = new kakao.maps.LatLng(lat, lng);
    const ov = new kakao.maps.CustomOverlay({ position: pos, content: html, yAnchor: y });
    ov.setMap(S.map); S.overlays.push(ov); bounds.extend(pos);
  };
  add(S.me.lat, S.me.lng, '<div class="me"></div>', 0.5);
  points.forEach(p => add(p.lat, p.lng, `<div class="mk ${p.kind||''}">${esc(p.label)}</div>`, 1.25));
  S.map.setBounds(bounds, 48, 40, 32, 40);
}
const hideMap = () => { $('#map').style.display = 'none'; };

/* ---------- 장소 목록 ---------- */
function routeLink(name, lat, lng){
  return `https://map.kakao.com/link/from/${encodeURIComponent('내 위치')},${S.me.lat},${S.me.lng}/to/${encodeURIComponent(name.replace(/,/g,' '))},${lat},${lng}`;
}
function renderPlaces(list, title, R = S.radius){
  if (!list.length) { hideMap(); return empty(S.authFail ? failMsg : `내 주변 ${fmtDist(R)} 안에서 찾지 못했어요.<br>${R < 70000 ? '범위를 넓히거나 ' : ''}다른 말로 검색해 보세요.`); }
  S.list = list; S.shown = Math.min(PAGE, list.length);
  $('#results').innerHTML = `<div class="rhead"><b>${esc(title)}</b><span>${fmtDist(R)} 안 · 가까운 순 ${list.length}곳</span></div>`
    + (S.partial ? `<div class="notice">가게가 너무 많아 일부만 보여요. 범위를 좁히면 더 정확해요.</div>` : '')
    + `<div id="plist">${list.slice(0, S.shown).map(placeCard).join('')}</div><div id="morebox"></div>`;
  renderMore();
}
const PAGE = 30;
function renderMore(){
  const left = S.list.length - S.shown;
  $('#morebox').innerHTML = left > 0 ? `<button class="more" id="btnMore">${Math.min(PAGE, left)}곳 더 보기 <span>(남은 ${left}곳)</span></button>` : '';
  drawPoints(S.list.slice(0, S.shown).map((p, i) => ({ lat: +p.y, lng: +p.x, label: i+1 })));
}
function showMore(){
  const from = S.shown; S.shown = Math.min(S.shown + PAGE, S.list.length);
  $('#plist').insertAdjacentHTML('beforeend', S.list.slice(from, S.shown).map((p, k) => placeCard(p, from + k)).join(''));
  renderMore();
}
function placeCard(p, i){
    const c = (p.category_name || '').split('>').pop().trim();
    return `<div class="card">
      <div class="prow" data-i="${i}"><span class="num">${i+1}</span><div class="pmain">
        <div class="pname">${isPick(p.place_name) ? '<span class="pick">추천</span>' : ''}${esc(p.place_name)}</div>
        <div class="pmeta"><span class="dist">${fmtDist(p.distance)}</span>${c ? `<span class="dot"></span><span>${esc(c)}</span>` : ''}</div>
        <div class="paddr">${esc(p.road_address_name || p.address_name)}</div></div></div>
      <div class="pbtns">
        <a class="main" target="_blank" rel="noopener" href="${routeLink(p.place_name, p.y, p.x)}">${ic('nav')}길찾기</a>
        ${p.phone ? `<a href="tel:${esc(p.phone)}">${ic('phone')}전화</a>` : ''}
        <a target="_blank" rel="noopener" href="${esc(p.place_url)}">${ic('info')}상세</a>
      </div></div>`;
}
function sortPlaces(arr){
  const seen = new Set();
  return arr.filter(p => !seen.has(p.id) && seen.add(p.id))
    .sort((a, b) => (isPick(b.place_name) - isPick(a.place_name)) || (a.distance - b.distance));
}

/* ---------- 탭별 검색 ---------- */
async function foodSearch(q){
  if (!q) return;
  loading('가까운 곳 찾는 중…');
  const cats = S.foodFilter === 'all' ? ['FD6', 'CE7'] : [S.foodFilter];
  let res = (await Promise.all(cats.map(c => kwR(q, { category_group_code: c })))).flat();
  if (!res.length) res = await kwR(q);
  renderPlaces(sortPlaces(res), q);
}
async function spotSearch(q, o){
  loading('주변 명소 찾는 중…');
  if (o.cat || !q) return renderPlaces(sortPlaces(await catR('AT4', '관광명소')), '주변 관광명소');
  renderPlaces(sortPlaces(await kwR(q)), q);
}
async function lifeSearch(q, o){
  loading('가까운 곳 찾는 중…');
  if (o.cat) return renderPlaces(sortPlaces(await catR(o.cat, o.label)), o.label);
  if (q) renderPlaces(sortPlaces(await kwR(q)), q);
}
async function nearStops(){
  loading('가까운 정류장 찾는 중…');
  renderPlaces(sortPlaces(await kwR('버스정류장', null, 1500)), '가까운 버스정류장', 1500);
}

/* ---------- 대중교통 ---------- */
/* 목적지는 거리 제한 없이 제주 전체에서 찾고, 공항·터미널·명소 같은 '갈 만한 곳'을 위로 올려요 */
const kwAny = q => new Promise(r => S.ps.keywordSearch(q, (d, st) => r(handleStatus(d, st)),
  { location: new kakao.maps.LatLng(S.me.lat, S.me.lng), sort: kakao.maps.services.SortBy.ACCURACY }));
function destScore(p, q){
  const n = p.place_name.replace(/\s/g, ''), k = q.replace(/\s/g, ''), c = p.category_name || '';
  let s = 0;
  if (n === k) s += 100; else if (n.startsWith(k)) s += 30; else if (n.includes(k)) s += 10;
  if (/공항|터미널|기차역|교통시설|관광|명소|시장|해수욕장|오름|공원|박물관|병원|학교|공공기관|관공서/.test(c)) s += 50;
  if (/부동산|중개|렌터카|대리운전|택시|주차장|정류장/.test(c)) s -= 60;
  return s;
}
async function transitSearch(q, o){
  if (o.special === 'stops') return nearStops();
  if (!q) return;
  loading('목적지 찾는 중…');
  const c = await kwAny(q);
  if (!c.length) { hideMap(); return empty(S.authFail ? failMsg : `'${esc(q)}'을(를) 찾지 못했어요.`); }
  S.cands = c.map((p, i) => ({ p, i, s: destScore(p, q) }))
    .sort((a, b) => b.s - a.s || a.i - b.i).slice(0, 6).map(x => x.p);
  routeTo(0);
}
async function routeTo(idx){
  const d = S.cands[idx];
  const rows = S.cands.map((c, i) => {
    const cat = (c.category_name || '').split('>').pop().trim();
    return `<button class="crow ${i === idx ? 'on' : ''}" data-cand="${i}"><span class="radio"></span>
      <span class="cmain"><b>${esc(c.place_name)}</b><span>${esc(cat)}${cat ? ' · ' : ''}${esc(c.road_address_name || c.address_name)}</span></span>
      <span class="cdist">${fmtDist(c.distance)}</span></button>`;
  }).join('');
  $('#results').innerHTML = `<div class="rhead"><b>도착지</b><span>${S.cands.length > 1 ? '다른 곳이면 눌러서 바꾸세요' : ''}</span></div>
    <div class="card clist">${rows}</div>
    <div id="routes"><div class="loading">버스 경로 찾는 중…</div></div>`;
  drawPoints([{ lat: +d.y, lng: +d.x, label: '도착', kind: 'dest' }]);
  try {
    const url = `https://api.odsay.com/v1/api/searchPubTransPathT?lang=0&SX=${S.me.lng}&SY=${S.me.lat}&EX=${d.x}&EY=${d.y}&apiKey=${encodeURIComponent(CONFIG.ODSAY_API_KEY)}`;
    const j = await (await fetch(url)).json();
    let err = j.error; if (Array.isArray(err)) err = err[0];
    if (err) {
      const code = String(err.code);
      const msg = code === '-98' ? '가까워서 걸어가는 게 더 빨라요.'
                : code === '-99' ? '버스 경로를 찾지 못했어요. 카카오맵으로 확인해 주세요.'
                : '지금은 버스 경로를 불러오지 못했어요. 카카오맵으로 확인해 주세요.';
      $('#routes').innerHTML = `<div class="notice">${msg} <a target="_blank" rel="noopener" href="${routeLink(d.place_name, d.y, d.x)}">카카오맵 열기</a></div>`; return;
    }
    const paths = (j.result && j.result.path) || [];
    if (!paths.length) { $('#routes').innerHTML = `<div class="notice">버스 경로를 찾지 못했어요.</div>`; return; }
    $('#routes').innerHTML = `<div class="rhead"><b>버스로 가는 방법</b><a class="klink" target="_blank" rel="noopener" href="${routeLink(d.place_name, d.y, d.x)}">카카오맵으로 보기</a></div>` + paths.slice(0, 5).map(pathCard).join('');
    const first = paths[0].subPath.find(s => s.trafficType !== 3);
    const pts = [{ lat: +d.y, lng: +d.x, label: '도착', kind: 'dest' }];
    if (first) pts.unshift({ lat: +first.startY, lng: +first.startX, label: first.startName + ' 승차', kind: 'stop' });
    drawPoints(pts);
  } catch (e) {
    $('#routes').innerHTML = `<div class="notice">지금은 버스 경로를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</div>`;
  }
}
function pathCard(p, i){
  const info = p.info, subs = p.subPath;
  const rides = subs.filter(s => s.trafficType !== 3);
  const first = rides[0], walk0 = subs[0] && subs[0].trafficType === 3 ? subs[0] : null;
  const lineName = s => s.trafficType === 2 ? s.lane.map(l => l.busNo).join(', ') + '번' : (s.lane[0] && s.lane[0].name) || '';
  const sum = first ? `${walk0 && walk0.distance ? `걸어서 ${walk0.sectionTime}분 → ` : ''}<b>${esc(first.startName)}</b>에서 <b>${esc(lineName(first))}</b> 타기` : '';
  const steps = subs.map(s => {
    if (s.trafficType === 3) return s.distance ? `<li>도보 ${s.sectionTime}분 <span class="s">${s.distance}m</span></li>` : '';
    const badges = s.trafficType === 2 ? s.lane.map(l => `<span class="bus">${esc(l.busNo)}</span>`).join('') : `<span class="bus">${esc(lineName(s))}</span>`;
    return `<li class="ride"><div>${badges}</div><b>${esc(s.startName)}</b> 승차 → <b>${esc(s.endName)}</b> 하차<br><span class="s">${s.stationCount}정거장 · ${s.sectionTime}분</span></li>`;
  }).join('');
  const h = Math.floor(info.totalTime / 60), m = info.totalTime % 60;
  return `<div class="card route"><div class="rtop">
    <span class="time">${h ? `${h}<small>시간 </small>` : ''}${m}<small>분</small></span>${i === 0 ? '<span class="best">추천</span>' : ''}
    <span class="rinfo">${(info.payment || 0).toLocaleString()}원 · ${rides.length > 1 ? `환승 ${rides.length - 1}회` : '환승 없음'} · 걷기 ${fmtDist(info.totalWalk)}</span></div>
    ${sum ? `<div class="sum">${sum}</div>` : ''}<ol class="steps">${steps}<li class="end">도착</li></ol></div>`;
}

/* ---------- 화면 ---------- */
function renderTab(){
  const t = TABS[S.tab];
  $('#q').placeholder = t.ph; $('#q').value = '';
  $('#chips').innerHTML = t.chips.map((c, i) => `<button class="chip" data-chip="${i}">${esc(c.label)}</button>`).join('');
  $('#seg').innerHTML = S.tab === 'food' ? `<div class="seg">${[['all','전체'],['FD6','음식점'],['CE7','카페']].map(([v, l]) =>
    `<button data-f="${v}" class="${S.foodFilter === v ? 'on' : ''}">${l}</button>`).join('')}</div>` : '';
  $('#radius').innerHTML = S.tab === 'transit' ? '' : `<span>내 주변</span><div class="seg">${RADII.map(k =>
    `<button data-r="${k * 1000}" class="${S.radius === k * 1000 ? 'on' : ''}">${k}km</button>`).join('')}</div>`;
  hideMap(); S.list = null; S.last = null;
  empty(t.hint);
}
function runSearch(q, o = {}){
  q = (q || '').trim();
  if (!S.kakao) { if (q) window.open('https://map.kakao.com/?q=' + encodeURIComponent(q), '_blank'); return; }
  if (!S.me) return;
  S.last = { q, o }; S.partial = false; S.authFail = false;
  ({ transit: transitSearch, food: foodSearch, spot: spotSearch, life: lifeSearch })[S.tab](q, o);
}

$('#tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return;
  S.tab = b.dataset.tab; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b)); renderTab(); };
$('#chips').onclick = e => { const b = e.target.closest('[data-chip]'); if (!b) return;
  const c = TABS[S.tab].chips[b.dataset.chip];
  document.querySelectorAll('#chips .chip').forEach(x => x.classList.toggle('on', x === b));
  $('#q').value = (c.cat || c.special) ? '' : c.label;
  runSearch((c.cat || c.special) ? '' : c.label, c); };
$('#seg').onclick = e => { const b = e.target.closest('[data-f]'); if (!b) return;
  S.foodFilter = b.dataset.f;
  document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x === b));
  if ($('#q').value.trim()) runSearch($('#q').value); };
const submit = () => { document.querySelectorAll('#chips .chip').forEach(x => x.classList.remove('on')); $('#q').blur(); runSearch($('#q').value); };
$('#btnGo').onclick = submit;
$('#q').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } };
$('#results').onclick = e => {
  if (e.target.closest('#btnMore')) return showMore();
  const c = e.target.closest('[data-cand]'); if (c) return routeTo(+c.dataset.cand);
  const r = e.target.closest('.prow'); if (r && S.map && S.list) { const p = S.list[r.dataset.i];
    S.map.setLevel(3); S.map.panTo(new kakao.maps.LatLng(p.y, p.x)); $('#map').scrollIntoView({ behavior: 'smooth', block: 'center' }); }
};
$('#radius').onclick = e => { const b = e.target.closest('[data-r]'); if (!b) return;
  S.radius = +b.dataset.r;
  try { localStorage.setItem('radius', S.radius); } catch(e) {}
  document.querySelectorAll('#radius button').forEach(x => x.classList.toggle('on', x === b));
  if (S.last && !S.last.o.special) runSearch(S.last.q, S.last.o); };
$('#btnLoc').onclick = refreshLocation;

(async function init(){
  renderTab();
  try { await loadKakao(); S.kakao = true; S.ps = new kakao.maps.services.Places(); }
  catch (e) { $('#setup').innerHTML = `<div class="notice">지금은 지도를 불러오지 못해서, 검색하면 카카오맵으로 연결돼요.</div>`; }
  await refreshLocation();
})();
</script>
</body>
</html>
